E9cnicos y tecnol\xF3gicos pertinentes a las vocaciones productivas del territorio, junto con una incubadora de emprendimiento agropecuario y de servicios, reduciendo en al menos 30% la migraci\xF3n juvenil forzada en un horizonte de cinco a\xF1os.",alternativa_solucion:"Establecimiento de un Centro Regional Multioperador articulado entre IES con presencia en el Caribe, el SENA y la gobernaci\xF3n, con sede f\xEDsica en Repel\xF3n por ser el municipio m\xE1s vulnerable (brecha 40) y punto de mayor acceso desde los dem\xE1s municipios del sur. El modelo combina presencialidad para laboratorios y pr\xE1cticas con virtualidad de banda ancha para clases magistrales, programas de emprendimiento agropecuario ligados a la cadena del arroz, la ganader\xEDa y la pesca lacustre del Embalse del Gu\xE1jaro, y una bolsa de primer empleo articulada con empresas de la Zona Franca de Barranquilla.",componentes:["Infraestructura f\xEDsica: construcci\xF3n o adecuaci\xF3n de sede de al menos 2.000 m\xB2 con aulas, laboratorios TIC, biblioteca y zona de coworking en Repel\xF3n","Conectividad: despliegue de fibra \xF3ptica o soluci\xF3n de banda ancha satelital para los cinco municipios, atendiendo la brecha TIC de 53.3 puntos","Oferta acad\xE9mica pertinente: programas t\xE9cnicos y tecnol\xF3gicos en agroindustria, gesti\xF3n ambiental del Embalse del Gu\xE1jaro, log\xEDstica y TI, en alianza con IES acreditadas","Incubadora de emprendimiento rural: acompa\xF1amiento a iniciativas productivas de j\xF3venes en agricultura, pesca, turismo de naturaleza y servicios digitales, con fondo semilla"],estudios_requeridos:["Estudio de demanda y pertinencia educativa en los cinco municipios del sur","Diagn\xF3stico de vocaciones productivas y cadenas de valor del sur del Atl\xE1ntico","Estudio de factibilidad t\xE9cnica y financiera del Centro Regional"],capacidades_universitarias:["Ingenier\xEDa agroindustrial y ciencias agropecuarias","Administraci\xF3n de empresas y emprendimiento","Ingenier\xEDa de sistemas y tecnolog\xEDas de la informaci\xF3n","Ciencias ambientales y gesti\xF3n de recursos h\xEDdricos","Pedagog\xEDa y educaci\xF3n rural"],aliados_potenciales:["Gobernaci\xF3n del Atl\xE1ntico","SENA Regional Atl\xE1ntico","Universidad del Atl\xE1ntico","Zona Franca de Barranquilla","C\xE1mara de Comercio de Barranquilla","MinEducaci\xF3n - Programa de Regionalizaci\xF3n"],fuentes_financiacion:[{fuente:"SGR - Fondo Inversi\xF3n Regional",tipo:"Regal\xEDas",monto_estimado:"$15.000-25.000 millones",viabilidad:"Alta"},{fuente:"SGR - Fondo CTeI",tipo:"Regal\xEDas CTeI",monto_estimado:"$1.900 millones (disponible)",viabilidad:"Alta"},{fuente:"MinEducaci\xF3n - Regionalizaci\xF3n ES",tipo:"Naci\xF3n",monto_estimado:"$3.000-5.000 millones",viabilidad:"Media"},{fuente:"Obras por impuestos (Zona Franca)",tipo:"P\xFAblico-Privado",monto_estimado:"$5.000-8.000 millones",viabilidad:"Media"},{fuente:"Cooperaci\xF3n internacional (BID/CAF)",tipo:"Cooperaci\xF3n",monto_estimado:"$2.000-4.000 millones",viabilidad:"Media"}],indicadores_clave:["Tasa de cobertura de educaci\xF3n superior en los 5 municipios (l\xEDnea base \u2192 meta a 5 a\xF1os)","N\xFAmero de j\xF3venes matriculados en programas pertinentes al territorio","Reducci\xF3n porcentual de migraci\xF3n juvenil hacia Barranquilla","Emprendimientos creados y sostenidos a 12 meses","Mejora en el pilar de Educaci\xF3n Superior del IDC departamental"],plazo_estimado:"36 a 48 meses para operaci\xF3n plena; primeros programas en 18 meses con infraestructura temporal.",proximo_paso:"Constituir mesa t\xE9cnica Gobernaci\xF3n-SENA-IES aliada antes de diciembre 2026 para definir oferta acad\xE9mica y modelo de operaci\xF3n multioperador.",dato_territorial:"El Atl\xE1ntico tiene $42.9 mil millones de caja disponible en regal\xEDas y la brecha de Desarrollo Econ\xF3mico de 69.2 puntos es la m\xE1s alta del departamento. Los cinco municipios del sur concentran las brechas m\xE1s severas del departamento (37-40 puntos promedio)."},antioquia:{reto_original:"En Urab\xE1 no hay internet decente, las empresas no se pueden digitalizar y los estudiantes no pueden estudiar virtual",problema_estructurado:"La subregi\xF3n de Urab\xE1 presenta una brecha cr\xEDtica en conectividad digital de 43.7 puntos respecto al promedio nacional, lo que limita severamente la competitividad empresarial y el acceso a educaci\xF3n virtual. El colapso simult\xE1neo entre baja velocidad de banda ancha, baja densidad empresarial formal y bajo desempe\xF1o educativo genera un c\xEDrculo vicioso donde sin conectividad no hay digitalizaci\xF3n, y sin digitalizaci\xF3n no hay productividad. Municipios como Murind\xF3 (brecha 37.8), Mutat\xE1 (36.0) y San Juan de Urab\xE1 (35.6) est\xE1n entre los m\xE1s desconectados del pa\xEDs.",poblacion_beneficiaria:"Poblaci\xF3n de la subregi\xF3n de Urab\xE1 estimada en 730.000 habitantes, con \xE9nfasis en 180.000 estudiantes de educaci\xF3n b\xE1sica, media y superior; 12.000 establecimientos del sector agroindustrial (banano, pl\xE1tano, ganader\xEDa); y los municipios con mayor vulnerabilidad digital: Murind\xF3, Mutat\xE1 y San Juan de Urab\xE1.",objetivo:"Incrementar en al menos 40 puntos porcentuales la cobertura de banda ancha de calidad en la subregi\xF3n de Urab\xE1 en un plazo de 36 meses, habilitando la digitalizaci\xF3n empresarial y la continuidad educativa virtual de sus habitantes.",alternativa_solucion:"Despliegue de infraestructura de conectividad de \xFAltima milla mediante tecnolog\xEDas mixtas (fibra \xF3ptica en cabeceras municipales, redes inal\xE1mbricas de largo alcance y soluciones satelitales de baja latencia en zonas dispersas) articulado con un programa de apropiaci\xF3n digital para empresas y comunidades educativas. El proyecto combina inversi\xF3n en infraestructura f\xEDsica con formaci\xF3n en competencias digitales y acompa\xF1amiento a la transformaci\xF3n digital del tejido empresarial local, especialmente la cadena del banano. Se implementar\xEDa bajo un esquema de Alianza P\xFAblico-Privada con operadores de telecomunicaciones y el sector bananero.",componentes:["Infraestructura de conectividad: despliegue de fibra \xF3ptica en 8 cabeceras municipales y soluciones de \xFAltima milla inal\xE1mbrica/satelital para zonas rurales dispersas","Centros de Transformaci\xF3n Digital: 5 centros equipados en Apartad\xF3, Turbo, Carepa, Chigorod\xF3 y Necocl\xED para formaci\xF3n, coworking y acceso p\xFAblico","Programa de digitalizaci\xF3n empresarial: acompa\xF1amiento t\xE9cnico a 2.000 empresas de la cadena del banano, pl\xE1tano y ganader\xEDa para adopci\xF3n de herramientas digitales","Educaci\xF3n conectada: dotaci\xF3n de conectividad a 120 instituciones educativas y formaci\xF3n a 500 docentes en pedagog\xEDa digital"],estudios_requeridos:["Diagn\xF3stico de infraestructura de telecomunicaciones existente y an\xE1lisis de brechas por municipio","Estudio de demanda de servicios digitales del sector bananero y agroindustrial","Dise\xF1o t\xE9cnico de la red de \xFAltima milla con an\xE1lisis de tecnolog\xEDas \xF3ptimas por zona"],capacidades_universitarias:["Ingenier\xEDa de telecomunicaciones y redes","Ingenier\xEDa de sistemas y desarrollo de software","Administraci\xF3n de empresas con \xE9nfasis en transformaci\xF3n digital","Pedagog\xEDa y tecnolog\xEDa educativa","Agronom\xEDa e innovaci\xF3n en cadenas productivas"],aliados_potenciales:["Gobernaci\xF3n de Antioquia","MinTIC - Programa de Conectividad Rural","AUGURA (Asociaci\xF3n de Bananeros)","Universidad de Antioquia - Seccional Urab\xE1","SENA Regional Urab\xE1","Operadores de telecomunicaciones (Claro, Tigo, ETB)"],fuentes_financiacion:[{fuente:"SGR - Fondo Inversi\xF3n Regional",tipo:"Regal\xEDas",monto_estimado:"$30.000-45.000 millones",viabilidad:"Alta"},{fuente:"SGR - Fondo CTeI",tipo:"Regal\xEDas CTeI",monto_estimado:"$6.187 millones (disponible)",viabilidad:"Alta"},{fuente:"MinTIC - Conectividad Rural",tipo:"Naci\xF3n",monto_estimado:"$15.000-20.000 millones",viabilidad:"Alta"},{fuente:"Obras por impuestos (sector bananero)",tipo:"P\xFAblico-Privado",monto_estimado:"$8.000-12.000 millones",viabilidad:"Alta"},{fuente:"BID/CAF - Inclusi\xF3n digital",tipo:"Cooperaci\xF3n",monto_estimado:"$5.000-10.000 millones",viabilidad:"Media"}],indicadores_clave:["Porcentaje de hogares con acceso a banda ancha en Urab\xE1","Velocidad promedio de conexi\xF3n en Mbps por municipio","N\xFAmero de empresas con adopci\xF3n de herramientas digitales","Instituciones educativas conectadas con servicio estable","Reducci\xF3n de la brecha TIC departamental en puntos IDC"],plazo_estimado:"30 a 36 meses para cobertura completa; primeros centros operativos en 12 meses.",proximo_paso:"Constituir alianza Gobernaci\xF3n-MinTIC-AUGURA antes de enero 2027 para definir modelo de APP y priorizar los municipios de arranque.",dato_territorial:"Antioquia tiene $388.3 mil millones de caja disponible en regal\xEDas. La brecha TIC del departamento es de 43.7 puntos, pero en municipios como Murind\xF3 (37.8) y Mutat\xE1 (36.0) la desconexi\xF3n es casi total. Mientras tanto, el sector bananero de Urab\xE1 exporta m\xE1s de USD 900 millones anuales pero opera con tecnolog\xEDa del siglo pasado."},valle:{reto_original:"Los municipios del norte se est\xE1n quedando sin gente, no hay industria y la tierra productiva se desperdicia",problema_estructurado:"Los municipios del norte del Valle del Cauca (El Cairo, El \xC1guila, El Dovio, La Cumbre, Argelia) registran brechas generalizadas superiores a 33 puntos, con despoblamiento progresivo por falta de oportunidades productivas. La tierra agr\xEDcola subutilizada, combinada con baja densidad empresarial (brecha de Desarrollo Econ\xF3mico de 53.3) y desconexi\xF3n vial (brecha de Transporte 30.9), crea una trampa de pobreza territorial que expulsa poblaci\xF3n joven hacia Cali y el Eje Cafetero. El contraste con la alta sofisticaci\xF3n productiva de Cali (9.61/10 en IDC) evidencia una desigualdad territorial extrema.",poblacion_beneficiaria:"Aproximadamente 45.000 habitantes rurales de los cinco municipios del norte del Valle, con \xE9nfasis en 8.000 productores agropecuarios (caf\xE9, pl\xE1tano, frutales, ganader\xEDa) y 5.000 j\xF3venes rurales entre 16 y 28 a\xF1os en riesgo de migraci\xF3n.",objetivo:"Reactivar el ecosistema productivo del norte del Valle articulando vocaciones agroindustriales locales con cadenas de valor regionales, generando al menos 1.500 empleos directos y triplicando el valor agregado agropecuario de la subregi\xF3n en un horizonte de cinco a\xF1os.",alternativa_solucion:"Programa de Reactivaci\xF3n Productiva del Norte del Valle que combina tres ejes: transformaci\xF3n agroindustrial (plantas de procesamiento de caf\xE9 especial, frutales y l\xE1cteos con sello de origen), turismo rural y de naturaleza (aprovechando la biodiversidad y paisaje cafetero), y conectividad productiva (mejoramiento de v\xEDas terciarias y conectividad digital). El modelo se apoya en cooperativas de productores existentes, la experiencia exportadora del Valle y alianzas universidad-empresa para asistencia t\xE9cnica y transferencia tecnol\xF3gica.",componentes:["Agroindustria de valor agregado: 3 plantas de transformaci\xF3n (caf\xE9 especial, frutales deshidratados, l\xE1cteos) con certificaciones de origen y acceso a mercados de Cali y exportaci\xF3n","Turismo rural sostenible: dise\xF1o e implementaci\xF3n de 2 rutas tur\xEDsticas (Ruta del Caf\xE9 del Norte y Ruta de Avistamiento de Aves) con capacitaci\xF3n a 200 familias como operadores tur\xEDsticos","Conectividad productiva: mejoramiento de 80 km de v\xEDas terciarias priorizadas y conectividad digital para las 5 cabeceras municipales","Fortalecimiento cooperativo: asistencia t\xE9cnica a 15 cooperativas y asociaciones de productores, programa de formalizaci\xF3n empresarial y acceso a cr\xE9dito"],estudios_requeridos:["Estudio de cadenas de valor y vocaciones productivas del norte del Valle","Plan maestro de turismo rural con an\xE1lisis de demanda y capacidad de carga","Dise\xF1o t\xE9cnico de plantas agroindustriales con estudios de mercado"],capacidades_universitarias:["Agronom\xEDa e ingenier\xEDa agroindustrial","Administraci\xF3n de empresas rurales y econom\xEDa solidaria","Biolog\xEDa y gesti\xF3n de biodiversidad (avifauna)","Ingenier\xEDa civil (v\xEDas terciarias)","Mercadeo y comercio internacional"],aliados_potenciales:["Gobernaci\xF3n del Valle del Cauca","C\xE1mara de Comercio de Cali","Federaci\xF3n Nacional de Cafeteros - Comit\xE9 del Valle","Universidad del Valle","SENA Regional Valle","ProColombia (turismo y exportaciones)"],fuentes_financiacion:[{fuente:"SGR - Fondo Inversi\xF3n Regional",tipo:"Regal\xEDas",monto_estimado:"$20.000-35.000 millones",viabilidad:"Alta"},{fuente:"SGR - Fondo CTeI",tipo:"Regal\xEDas CTeI",monto_estimado:"$6.506 millones (disponible)",viabilidad:"Alta"},{fuente:"Obras por impuestos",tipo:"P\xFAblico-Privado",monto_estimado:"$10.000-15.000 millones",viabilidad:"Alta"},{fuente:"MinAgricultura - Alianzas Productivas",tipo:"Naci\xF3n",monto_estimado:"$3.000-5.000 millones",viabilidad:"Media"},{fuente:"GIZ/USAID - Desarrollo rural",tipo:"Cooperaci\xF3n",monto_estimado:"$4.000-8.000 millones",viabilidad:"Media"}],indicadores_clave:["Empleos directos generados en la subregi\xF3n","Valor de producci\xF3n agroindustrial transformada (vs materia prima)","Visitantes a rutas de turismo rural por a\xF1o","Kil\xF3metros de v\xEDas terciarias mejoradas","Tasa de migraci\xF3n juvenil (reducci\xF3n)"],plazo_estimado:"48 a 60 meses para impacto pleno; primeras plantas operativas en 24 meses.",proximo_paso:"Convocar mesa de trabajo Gobernaci\xF3n-Alcald\xEDas-Federaci\xF3n de Cafeteros-Univalle antes de febrero 2027 para priorizar cadenas productivas y localizaci\xF3n de plantas.",dato_territorial:"El Valle tiene $78.1 mil millones de caja disponible en regal\xEDas y su pilar de Sofisticaci\xF3n es el m\xE1s alto del pa\xEDs (9.61/10), pero ese conocimiento productivo no llega al norte del departamento donde municipios como El Cairo (35.1) y El \xC1guila (34.0) tienen brechas comparables a departamentos de baja competitividad."},choco:{reto_original:"No tenemos agua potable en varios municipios, la gente se enferma constantemente y el acueducto nunca llega",problema_estructurado:"El Choc\xF3 registra la brecha de Vivienda y Servicios P\xFAblicos m\xE1s alta del pa\xEDs (63.9 puntos), con municipios como Carmen del Dari\xE9n (brecha 47.6), Riosucio (46.0) y Bajo Baud\xF3 (44.3) donde la cobertura de acueducto es inferior al 15% y la tasa de morbilidad por enfermedades diarreicas agudas triplica el promedio nacional. La combinaci\xF3n de infraestructura inexistente, dispersi\xF3n poblacional, dificultad de acceso fluvial y baja capacidad institucional municipal ha convertido el acceso a agua potable en una emergencia sanitaria cr\xF3nica que afecta desproporcionadamente a ni\xF1os y comunidades \xE9tnicas.",poblacion_beneficiaria:"Aproximadamente 280.000 habitantes de los municipios con mayores brechas en servicios p\xFAblicos: Carmen del Dari\xE9n, Riosucio, Bagad\xF3, Bajo Baud\xF3, Medio Baud\xF3 y sus comunidades rurales dispersas a lo largo de los r\xEDos Atrato y Baud\xF3. Poblaci\xF3n mayoritariamente afrocolombiana e ind\xEDgena (95%), con 85.000 menores de 14 a\xF1os como grupo m\xE1s vulnerable.",objetivo:"Garantizar acceso a agua potable segura para al menos 50.000 personas en las comunidades m\xE1s vulnerables del Choc\xF3 mediante sistemas descentralizados de potabilizaci\xF3n adaptados a la realidad geogr\xE1fica del departamento, reduciendo en un 60% la tasa de morbilidad por EDA en un plazo de 36 meses.",alternativa_solucion:"Implementaci\xF3n de un programa de Agua Segura Descentralizada con 80 sistemas comunitarios de potabilizaci\xF3n (filtraci\xF3n, desinfecci\xF3n solar y cloraci\xF3n) adaptados a comunidades ribere\xF1as dispersas, complementados con 8 plantas compactas de tratamiento para cabeceras municipales. El modelo descentralizado evita depender de grandes redes de acueducto inviables en la geograf\xEDa del Choc\xF3, y se apoya en gesti\xF3n comunitaria capacitada para operaci\xF3n y mantenimiento. Incluye un componente de monitoreo de calidad de agua con sensores IoT y un laboratorio m\xF3vil fluvial.",componentes:["80 sistemas comunitarios de potabilizaci\xF3n: filtraci\xF3n multietapa y desinfecci\xF3n adaptada para comunidades de 200-2.000 habitantes a lo largo de los r\xEDos Atrato y Baud\xF3","8 plantas compactas de tratamiento para cabeceras municipales priorizadas, con capacidad de 5-20 litros/segundo","Programa de gesti\xF3n comunitaria del agua: capacitaci\xF3n a 160 operadores locales (2 por sistema), creaci\xF3n de juntas administradoras y esquema de sostenibilidad financiera","Laboratorio m\xF3vil fluvial y red de 40 sensores IoT para monitoreo continuo de calidad de agua en puntos cr\xEDticos"],estudios_requeridos:["Caracterizaci\xF3n de fuentes h\xEDdricas y an\xE1lisis de calidad de agua por cuenca","Estudio de demanda y dise\xF1o t\xE9cnico por comunidad (80 sistemas + 8 plantas)","Diagn\xF3stico de capacidad institucional municipal y comunitaria para operaci\xF3n sostenible"],capacidades_universitarias:["Ingenier\xEDa sanitaria y ambiental","Ingenier\xEDa civil hidr\xE1ulica","Microbiolog\xEDa y salud p\xFAblica","Ingenier\xEDa electr\xF3nica (IoT y sensores)","Trabajo social y gesti\xF3n comunitaria","Antropolog\xEDa y enfoque \xE9tnico-territorial"],aliados_potenciales:["Gobernaci\xF3n del Choc\xF3","MinVivienda - Programa Agua Rural","UNICEF Colombia","Fundaci\xF3n Plan Internacional","Universidad Tecnol\xF3gica del Choc\xF3","IIAP (Instituto de Investigaciones Ambientales del Pac\xEDfico)","Consejo Comunitario Mayor del Atrato (COCOMACIA)"],fuentes_financiacion:[{fuente:"SGR - Fondo Inversi\xF3n Regional",tipo:"Regal\xEDas",monto_estimado:"$60.000-90.000 millones",viabilidad:"Alta"},{fuente:"SGR - Caja disponible",tipo:"Regal\xEDas",monto_estimado:"$178.792 millones disponibles",viabilidad:"Alta"},{fuente:"MinVivienda - Agua Rural",tipo:"Naci\xF3n",monto_estimado:"$20.000-30.000 millones",viabilidad:"Alta"},{fuente:"UNICEF/BID - WASH Programs",tipo:"Cooperaci\xF3n",monto_estimado:"$10.000-20.000 millones",viabilidad:"Alta"},{fuente:"Fondo de Adaptaci\xF3n al Cambio Clim\xE1tico",tipo:"Naci\xF3n",monto_estimado:"$5.000-10.000 millones",viabilidad:"Media"}],indicadores_clave:["Personas con acceso a agua potable segura (l\xEDnea base \u2192 meta)","Tasa de morbilidad por EDA en menores de 5 a\xF1os","Sistemas comunitarios operando con calidad certificada a 12 meses","\xCDndice de calidad de agua en puntos monitoreados","Sostenibilidad financiera de las juntas administradoras"],plazo_estimado:"30 a 36 meses para los 80 sistemas comunitarios; plantas compactas en 18-24 meses.",proximo_paso:"Constituir unidad ejecutora Gobernaci\xF3n-MinVivienda-UNICEF antes de diciembre 2026 e iniciar caracterizaci\xF3n de las 80 comunidades priorizadas.",dato_territorial:"El Choc\xF3 tiene $178.8 mil millones de caja disponible de regal\xEDas sin ejecutar, la brecha de Vivienda/SSPP de 63.9 es la m\xE1s alta del pa\xEDs, y la educaci\xF3n superior es pr\xE1cticamente inexistente (1.27/10). Carmen del Dari\xE9n tiene una brecha de 47.6, la m\xE1s alta de cualquier municipio en los seis departamentos analizados."},meta:{reto_original:"Tenemos miles de millones en regal\xEDas y no sabemos c\xF3mo ejecutarlos, los proyectos no se formulan bien",problema_estructurado:"El Meta tiene el presupuesto de regal\xEDas m\xE1s alto entre los departamentos analizados ($3.8 billones) pero la tasa de ejecuci\xF3n m\xE1s baja (53.5%), con $206 mil millones de caja disponible. La paradoja es que un departamento con PIB per c\xE1pita de $47.8 millones y recursos abundantes tiene indicadores de Innovaci\xF3n (2.27/10) y Sofisticaci\xF3n (3.28/10) propios de departamentos con una fracci\xF3n de sus recursos. La ra\xEDz del problema es la baja capacidad de formulaci\xF3n de proyectos: sin estudios previos de calidad, sin equipos t\xE9cnicos en los municipios, y sin articulaci\xF3n con universidades que aporten rigor metodol\xF3gico, los recursos no se convierten en inversi\xF3n.",poblacion_beneficiaria:"29 municipios del Meta con sus equipos de gobierno, estimando 1.166.652 habitantes como beneficiarios indirectos de una mejor ejecuci\xF3n de regal\xEDas. Beneficiarios directos: 200+ funcionarios de planeaci\xF3n municipal y 50+ equipos de formulaci\xF3n de proyectos que ser\xE1n fortalecidos.",objetivo:"Triplicar la capacidad de formulaci\xF3n y ejecuci\xF3n de proyectos de calidad en el Meta, llevando la tasa de ejecuci\xF3n de regal\xEDas del 53.5% al 75% en 24 meses, mediante una Unidad Departamental de Formulaci\xF3n que articule universidades, gobierno y sector privado.",alternativa_solucion:"Creaci\xF3n de la Unidad de Formulaci\xF3n Estrat\xE9gica del Meta (UFEM): un equipo t\xE9cnico permanente, alojado en la gobernaci\xF3n pero operado en alianza con universidades, que acompa\xF1a a los 29 municipios en la estructuraci\xF3n de proyectos de inversi\xF3n. La UFEM combina formuladores senior de planta con pasantes universitarios rotantes, usa una plataforma digital de gesti\xF3n de proyectos para trazabilidad en tiempo real, y opera bajo un modelo de 'factor\xEDa de proyectos' donde cada proyecto pasa por etapas estandarizadas: idea \u2192 prefactibilidad \u2192 factibilidad \u2192 radicaci\xF3n OCAD. Incluye un programa de fortalecimiento de capacidades a funcionarios municipales de planeaci\xF3n.",componentes:["UFEM operativa: equipo de 15 formuladores senior + 30 pasantes universitarios rotantes en convenio con 3 universidades del departamento","Plataforma digital de gesti\xF3n: sistema de seguimiento de proyectos desde idea hasta ejecuci\xF3n con dashboard p\xFAblico de avance y alertas","Programa de fortalecimiento municipal: 4 ciclos anuales de ca o aprobado por a\xF1o","Monto de recursos desbloqueados por mejor formulaci\xF3n"],plazo_estimado:"UFEM operativa en 6 meses; resultados medibles en ejecuci\xF3n de regal\xEDas a 18-24 meses.",proximo_paso:"Firmar convenio marco Gobernaci\xF3n-Universidad de los Llanos-DNP antes de diciembre 2026 para la creaci\xF3n de la UFEM y definir los primeros 10 municipios de intervenci\xF3n.",dato_territorial:"El Meta tiene $3.8 billones de presupuesto SGR pero solo ha ejecutado el 53.5%. Con $206 mil millones de caja disponible, el departamento tiene m\xE1s recursos sin usar que el presupuesto total de regal\xEDas de muchos departamentos. Su pilar de Innovaci\xF3n (2.27/10) y Sofisticaci\xF3n (3.28/10) son los m\xE1s bajos entre los departamentos con PIB per c\xE1pita alto."},bogota:{reto_original:"El transporte p\xFAblico no funciona, la movilidad frena la productividad de toda la ciudad",problema_estructurado:"Bogot\xE1, pese a liderar el IDC nacional (7.96/10) y tener el mayor entorno de negocios del pa\xEDs (9.76/10), experimenta un deterioro en su competitividad (cay\xF3 de 8.04 a 7.96 entre 2025 y 2026). La movilidad es uno de los factores m\xE1s citados: los tiempos de desplazamiento promedio superan los 75 minutos diarios, la integraci\xF3n tarifaria del SITP sigue incompleta, y las localidades perif\xE9ricas del sur y occidente concentran los mayores tiempos de viaje, afectando desproporcionadamente a la poblaci\xF3n trabajadora de menores ingresos. La brecha de Deporte y Recreaci\xF3n (55.2) sugiere tambi\xE9n d\xE9ficit de espacio p\xFAblico que agrava la percepci\xF3n de calidad de vida.",poblacion_beneficiaria:"7.9 millones de habitantes de Bogot\xE1, con \xE9nfasis en los 3.2 millones de usuarios diarios del SITP/TransMilenio y los 1.8 millones de trabajadores que residen en localidades perif\xE9ricas (Ciudad Bol\xEDvar, Bosa, Kennedy, Suba occidental, Usme) donde los tiempos de desplazamiento superan los 90 minutos diarios.",objetivo:"Reducir en 20% los tiempos de desplazamiento promedio en las localidades perif\xE9ricas de Bogot\xE1 mediante una estrategia de movilidad multimodal que integre transporte p\xFAblico, bicicleta, caminata y trabajo remoto, mejorando simult\xE1neamente el espacio p\xFAblico y la calidad de vida urbana.",alternativa_solucion:"Programa Bogot\xE1 Polic\xE9ntrica: desarrollo de 5 Centros de Actividad Econ\xF3mica (CAE) en las localidades perif\xE9ricas que concentren servicios p\xFAblicos, espacios de coworking, centros de formaci\xF3n del SENA y oferta cultural/deportiva, reduciendo la necesidad de desplazamiento al centro expandido. Cada CAE se articula con una red de ciclov\xEDas alimentadoras, estaciones de SITP mejoradas y un programa de incentivos para teletrabajo. El concepto es invertir la l\xF3gica: en vez de mover m\xE1s personas m\xE1s r\xE1pido al centro, llevar las oportunidades a donde vive la gente.",componentes:["5 Centros de Actividad Econ\xF3mica (CAE): espacios de 5.000 m\xB2 en Ciudad Bol\xEDvar, Bosa, Kennedy, Suba occidental y Usme con coworking, SENA, servicios distritales y oferta cultural","Red de movilidad alimentadora: 40 km de ciclov\xEDas nuevas conectando los CAE con estaciones de TransMilenio y SITP, con biciestacionamientos seguros","Programa de teletrabajo productivo: plataforma distrital de incentivos para empresas que adopten esquemas de trabajo remoto e h\xEDbrido, meta 200.000 trabajadores","Espacio p\xFAblico activo: intervenci\xF3n de 25 parques y espacios deportivos en las 5 localidades priorizadas, atendiendo la brecha de Deporte de 55.2 puntos"],estudios_requeridos:["Estudio de movilidad y tiempos de desplazamiento por localidad con datos de celular y tarjetas SITP","An\xE1lisis de demanda de servicios y empleo por localidad para dise\xF1o de los CAE","Evaluaci\xF3n de impacto de programas de teletrabajo en ciudades comparables de Am\xE9rica Latina"],capacidades_universitarias:["Urbanismo y planificaci\xF3n territorial","Ingenier\xEDa de transporte y movilidad","Econom\xEDa urbana y mercados de trabajo","Arquitectura y dise\xF1o de espacio p\xFAblico","Ciencias sociales y participaci\xF3n comunitaria"],aliados_potenciales:["Alcald\xEDa Mayor de Bogot\xE1 - Secretar\xEDa de Movilidad","TransMilenio S.A.","SENA - Direcci\xF3n Regional Bogot\xE1","C\xE1mara de Comercio de Bogot\xE1","Universidad Nacional de Colombia","Universidad de los Andes - CEDE","Findeter"],fuentes_financiacion:[{fuente:"SGR - Fondo Inversi\xF3n Regional",tipo:"Regal\xEDas",monto_estimado:"$40.000-60.000 millones",viabilidad:"Alta"},{fuente:"SGR - Caja disponible Bogot\xE1",tipo:"Regal\xEDas",monto_estimado:"$96.736 millones disponibles",viabilidad:"Alta"},{fuente:"Presupuesto Distrital",tipo:"Recursos propios",monto_estimado:"$80.000-120.000 millones",viabilidad:"Alta"},{fuente:"Findeter - Ciudades sostenibles",tipo:"Banca de desarrollo",monto_estimado:"$30.000-50.000 millones",viabilidad:"Alta"},{fuente:"BID/CAF - Movilidad urbana",tipo:"Cooperaci\xF3n",monto_estimado:"$20.000-40.000 millones",viabilidad:"Media"}],indicadores_clave:["Tiempo promedio de desplazamiento en localidades priorizadas (minutos)","Usuarios de los CAE por mes","Trabajadores en esquema de teletrabajo formal","Kil\xF3metros de ciclov\xEDa nueva construida y en uso","Metros cuadrados de espacio p\xFAblico intervenido"],plazo_estimado:"Primeros 2 CAE operativos en 18 meses; programa completo en 36-48 meses.",proximo_paso:"Presentar el concepto de Bogot\xE1 Polic\xE9ntrica al equipo de Secretar\xEDa de Planeaci\xF3n y Movilidad antes de enero 2027 y seleccionar las 2 localidades piloto con base en datos de movilidad.",dato_territorial:"Bogot\xE1 tiene $96.7 mil millones de caja disponible en regal\xEDas y su IDC cay\xF3 de 8.04 a 7.96 en 2026, el \xFAnico retroceso entre los departamentos l\xEDderes. La brecha de Deporte (55.2) es la m\xE1s alta del pa\xEDs para una capital, y la de Innovaci\xF3n (5.08/10) sigue siendo baja para una ciudad que concentra el 25.2% del PIB nacio
